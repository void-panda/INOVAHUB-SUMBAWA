<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <marker id="crowMany" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 6 L 0 11 M 10 0 L 10 12" stroke="#000000" stroke-width="1.5" fill="none" />
    </marker>
    <marker id="crowOne" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 6 0 L 6 12 M 10 0 L 10 12" stroke="#000000" stroke-width="1.5" fill="none" />
    </marker>
  </defs>

  <!-- Title Banner (Black & White) -->
  <rect x="25" y="15" width="1100" height="45" rx="6" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <text x="575" y="38" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="0.5">DIAGRAM ENTITAS BASIS DATA &amp; RELASI (ERD) — INOVA-HUB SUMBAWA</text>

  <!-- Table 1: OPD -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="200" height="145" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="200" height="4" fill="#1e293b"/>
    <text x="100" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">opd</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">    nama_opd <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">    kode <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    singkatan <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    kepala_opd <tspan fill="#64748b">varchar</tspan></text>
  </g>

  <!-- Table 2: USERS -->
  <g transform="translate(30, 260)">
    <rect x="0" y="0" width="200" height="155" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="200" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="200" height="4" fill="#1e293b"/>
    <text x="100" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">users</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">FK  opd_id <tspan fill="#64748b">bigint (null)</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">    name <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    email <tspan fill="#64748b">varchar (unique)</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    password <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="148" fill="#000000" font-size="10">    roles <tspan fill="#64748b">spatie_permission</tspan></text>
  </g>

  <!-- Table 3: INOVASI (Core Entity) -->
  <g transform="translate(300, 140)">
    <rect x="0" y="0" width="240" height="270" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#0f172a"/>
    <rect x="0" y="28" width="240" height="4" fill="#0f172a"/>
    <text x="120" y="22" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">inovasi</text>
    <text x="14" y="54" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="14" y="74" fill="#000000" font-size="10">FK  opd_id <tspan fill="#64748b">bigint (null)</tspan></text>
    <text x="14" y="94" fill="#000000" font-size="10">FK  user_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="14" y="114" fill="#000000" font-size="10">FK  periode_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="14" y="134" fill="#000000" font-size="10">    nama_inovasi <tspan fill="#64748b">varchar</tspan></text>
    <text x="14" y="154" fill="#000000" font-size="10">    tahapan <tspan fill="#64748b">enum</tspan></text>
    <text x="14" y="174" fill="#000000" font-size="10">    bentuk_inovasi <tspan fill="#64748b">varchar</tspan></text>
    <text x="14" y="194" fill="#000000" font-size="10">    urusan_utama <tspan fill="#64748b">varchar</tspan></text>
    <text x="14" y="214" fill="#000000" font-size="10" font-weight="bold">    status <tspan fill="#0f172a">(8-langkah)</tspan></text>
    <text x="14" y="234" fill="#000000" font-size="10">    skor_total_sid <tspan fill="#64748b">numeric</tspan></text>
    <text x="14" y="254" fill="#000000" font-size="10">    skor_kematangan <tspan fill="#64748b">varchar</tspan></text>
  </g>

  <!-- Table 4: INOVASI_DOKUMEN -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="220" height="155" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="220" height="4" fill="#1e293b"/>
    <text x="110" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">inovasi_dokumen</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">FK  inovasi_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">FK  indikator_id <tspan fill="#64748b">bigint (null)</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    jenis <tspan fill="#64748b">enum</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    file_path <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="148" fill="#000000" font-size="10">    file_size_kb <tspan fill="#64748b">integer</tspan></text>
  </g>

  <!-- Table 5: SKOR_INOVASI -->
  <g transform="translate(610, 270)">
    <rect x="0" y="0" width="220" height="155" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="220" height="4" fill="#1e293b"/>
    <text x="110" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">skor_inovasi</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">FK  inovasi_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">FK  indikator_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    nilai_parameter <tspan fill="#64748b">varchar (P1-P3)</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    skor_terbobot <tspan fill="#64748b">numeric</tspan></text>
    <text x="12" y="148" fill="#000000" font-size="10">    catatan_revisi <tspan fill="#64748b">text (null)</tspan></text>
  </g>

  <!-- Table 6: INDIKATOR_SID -->
  <g transform="translate(890, 270)">
    <rect x="0" y="0" width="220" height="155" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="220" height="4" fill="#1e293b"/>
    <text x="110" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">indikator_sid</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">    kode <tspan fill="#64748b">varchar (IND-01..20)</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">    nama_indikator <tspan fill="#64748b">varchar</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    bobot <tspan fill="#64748b">numeric</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    parameter_options <tspan fill="#64748b">jsonb</tspan></text>
    <text x="12" y="148" fill="#000000" font-size="10">    jenis_dokumen <tspan fill="#64748b">varchar</tspan></text>
  </g>

  <!-- Table 7: VALIDASI_LOG -->
  <g transform="translate(30, 460)">
    <rect x="0" y="0" width="240" height="145" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="240" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="240" height="4" fill="#1e293b"/>
    <text x="120" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">validasi_log</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">FK  inovasi_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">FK  user_id <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    status_asal <tspan fill="#64748b">varchar</tspan> ➔ status_tujuan</text>
    <text x="12" y="128" fill="#000000" font-size="10">    komentar <tspan fill="#64748b">text</tspan></text>
  </g>

  <!-- Table 8: INOVASI_VERSI -->
  <g transform="translate(320, 460)">
    <rect x="0" y="0" width="230" height="145" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="230" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="230" height="4" fill="#1e293b"/>
    <text x="115" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">inovasi_versi</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">FK  inovasi_id_lama <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">FK  inovasi_id_baru <tspan fill="#64748b">bigint</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    penjelasan_pengembangan <tspan fill="#64748b">text</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    created_at <tspan fill="#64748b">timestamp</tspan></text>
  </g>

  <!-- Table 9: PERIODE_LOMBA -->
  <g transform="translate(610, 460)">
    <rect x="0" y="0" width="220" height="145" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="220" height="28" rx="5" fill="#1e293b"/>
    <rect x="0" y="24" width="220" height="4" fill="#1e293b"/>
    <text x="110" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">periode_lomba</text>
    <text x="12" y="48" fill="#000000" font-size="10" font-weight="bold">PK  id <tspan fill="#64748b" font-weight="normal">bigint</tspan></text>
    <text x="12" y="68" fill="#000000" font-size="10">    tahun <tspan fill="#64748b">integer (unique)</tspan></text>
    <text x="12" y="88" fill="#000000" font-size="10">    status_aktif <tspan fill="#64748b">boolean</tspan></text>
    <text x="12" y="108" fill="#000000" font-size="10">    tanggal_mulai <tspan fill="#64748b">date</tspan></text>
    <text x="12" y="128" fill="#000000" font-size="10">    tanggal_selesai <tspan fill="#64748b">date</tspan></text>
  </g>

  <!-- Relationship Connectors (Monochrome Lines) -->
  <!-- OPD -> USERS -->
  <path d="M 130 225 L 130 260" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- OPD -> INOVASI -->
  <path d="M 230 150 L 300 170" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- USERS -> INOVASI -->
  <path d="M 230 330 L 300 290" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- INOVASI -> INOVASI_DOKUMEN -->
  <path d="M 540 210 L 610 150" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- INOVASI -> SKOR_INOVASI -->
  <path d="M 540 280 L 610 320" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- INDIKATOR_SID -> SKOR_INOVASI -->
  <path d="M 890 340 L 830 340" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- INOVASI -> VALIDASI_LOG -->
  <path d="M 370 410 L 150 460" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- INOVASI -> INOVASI_VERSI -->
  <path d="M 420 410 L 420 460" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

  <!-- PERIODE_LOMBA -> INOVASI -->
  <path d="M 610 500 L 500 410" stroke="#000000" stroke-width="1.5" fill="none" marker-start="url(#crowOne)" marker-end="url(#crowMany)" />

</svg>
