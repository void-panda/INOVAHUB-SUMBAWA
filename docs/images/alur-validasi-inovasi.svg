<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Monochrome Filters & Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- Monochrome Marker Arrows -->
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Top Banner Title (Black & White) -->
  <rect x="25" y="20" width="1150" height="60" rx="8" fill="#0f172a" stroke="#000000" stroke-width="1.5" />
  <text x="600" y="46" fill="#ffffff" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="0.5">ALUR KERJA &amp; VALIDASI 8 TAHAP INOVASI DAERAH (INOVA-HUB SUMBAWA)</text>
  <text x="600" y="66" fill="#cbd5e1" font-size="11" font-weight="500" text-anchor="middle">Sesuai Pedoman IGA 2026 Kemendagri &amp; TOR DINOLA §5 — Riwayat Transisi Status Tercatat di validasi_log</text>

  <!-- ==================== LANE 1: INOVATOR ==================== -->
  <rect x="25" y="95" width="275" height="660" rx="8" fill="#fafafa" stroke="#334155" stroke-width="1.5" />
  <rect x="25" y="95" width="275" height="40" rx="8" fill="#1e293b" />
  <rect x="25" y="125" width="275" height="10" fill="#1e293b" />
  <text x="162" y="121" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1. INOVATOR (OPD &amp; MASYARAKAT)</text>

  <!-- Start Circle -->
  <circle cx="162" cy="170" r="22" fill="#0f172a" stroke="#000000" stroke-width="2" filter="url(#shadow)" />
  <text x="162" y="174" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">MULAI</text>

  <!-- Step 1: Draft -->
  <rect x="45" y="220" width="235" height="85" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="55" y="230" width="60" height="20" rx="3" fill="#0f172a" />
  <text x="85" y="244" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 1</text>
  <text x="125" y="244" fill="#000000" font-size="13" font-weight="bold">draft</text>
  <text x="55" y="268" fill="#334155" font-size="11">• Input Profil &amp; Bentuk Inovasi</text>
  <text x="55" y="284" fill="#334155" font-size="11">• Upload Proposal &amp; SK Tim</text>
  <text x="55" y="300" fill="#334155" font-size="11">• Isi 20 Lembar Kerja Indikator SID</text>

  <!-- Step 2: Diajukan -->
  <rect x="45" y="345" width="235" height="75" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="55" y="355" width="60" height="20" rx="3" fill="#0f172a" />
  <text x="85" y="369" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 2</text>
  <text x="125" y="369" fill="#000000" font-size="13" font-weight="bold">diajukan</text>
  <text x="55" y="393" fill="#334155" font-size="11">• Inovator submit seluruh berkas</text>
  <text x="55" y="409" fill="#334155" font-size="11">• Pengajuan masuk antrean validasi</text>

  <!-- Step 4a: Revisi -->
  <rect x="45" y="475" width="235" height="85" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" stroke-dasharray="4 2" filter="url(#shadow)" />
  <rect x="55" y="485" width="68" height="20" rx="3" fill="#334155" />
  <text x="89" y="499" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 4A</text>
  <text x="133" y="499" fill="#000000" font-size="13" font-weight="bold">revisi</text>
  <text x="55" y="523" fill="#334155" font-size="11">• Terdapat catatan koreksi bukti</text>
  <text x="55" y="539" fill="#334155" font-size="11">• Inovator memperbaiki data</text>
  <text x="55" y="555" fill="#334155" font-size="11">• Unggah ulang berkas indikator</text>

  <!-- ==================== LANE 2: PENDAMPING ==================== -->
  <rect x="315" y="95" width="280" height="660" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <rect x="315" y="95" width="280" height="40" rx="8" fill="#1e293b" />
  <rect x="315" y="125" width="280" height="10" fill="#1e293b" />
  <text x="455" y="121" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2. PENDAMPING &amp; VERIFIKATOR OPD</text>

  <!-- Step 3: Divalidasi -->
  <rect x="335" y="345" width="240" height="75" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="345" y="355" width="60" height="20" rx="3" fill="#0f172a" />
  <text x="375" y="369" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 3</text>
  <text x="415" y="369" fill="#000000" font-size="13" font-weight="bold">divalidasi</text>
  <text x="345" y="393" fill="#334155" font-size="11">• Verifikator menelaah berkas</text>
  <text x="345" y="409" fill="#334155" font-size="11">• Uji parameter &amp; keabsahan 20 SID</text>

  <!-- Decision Diamond (Black & White) -->
  <g transform="translate(455, 515)">
    <polygon points="0,-40 75,0 0,40 -75,0" fill="#f1f5f9" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="-6" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Berkas &amp; Bukti</text>
    <text x="0" y="10" fill="#000000" font-size="11" font-weight="bold" text-anchor="middle">Valid?</text>
  </g>

  <!-- Step 4b: Disetujui -->
  <rect x="335" y="585" width="240" height="65" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="345" y="595" width="68" height="20" rx="3" fill="#0f172a" />
  <text x="379" y="609" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 4B</text>
  <text x="423" y="609" fill="#000000" font-size="13" font-weight="bold">disetujui</text>
  <text x="345" y="632" fill="#334155" font-size="11">• Berkas lolos verifikasi pendamping</text>

  <!-- Step 5: Disahkan OPD -->
  <rect x="335" y="675" width="240" height="65" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="345" y="685" width="60" height="20" rx="3" fill="#0f172a" />
  <text x="375" y="699" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 5</text>
  <text x="415" y="699" fill="#000000" font-size="13" font-weight="bold">disahkan_opd</text>
  <text x="345" y="722" fill="#334155" font-size="11">• Terbit Lembar Pengesahan Kepala OPD</text>

  <!-- ==================== LANE 3: TIM PENILAI ==================== -->
  <rect x="610" y="95" width="280" height="660" rx="8" fill="#fafafa" stroke="#334155" stroke-width="1.5" />
  <rect x="610" y="95" width="280" height="40" rx="8" fill="#1e293b" />
  <rect x="610" y="125" width="280" height="10" fill="#1e293b" />
  <text x="750" y="121" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3. TIM PENILAI &amp; BAPPEDA LITBANG</text>

  <!-- Step 6: Review Internal -->
  <rect x="630" y="675" width="240" height="65" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="640" y="685" width="60" height="20" rx="3" fill="#0f172a" />
  <text x="670" y="699" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 6</text>
  <text x="710" y="699" fill="#000000" font-size="13" font-weight="bold">review_internal</text>
  <text x="640" y="722" fill="#334155" font-size="11">• Sinkronisasi skor SID &amp; SPD Pemda</text>

  <!-- Step 7: Siap Kirim -->
  <rect x="630" y="475" width="240" height="75" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="640" y="485" width="60" height="20" rx="3" fill="#0f172a" />
  <text x="670" y="499" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 7</text>
  <text x="710" y="499" fill="#000000" font-size="13" font-weight="bold">siap_kirim</text>
  <text x="640" y="523" fill="#334155" font-size="11">• Finalisasi data &amp; skoring IID</text>
  <text x="640" y="539" fill="#334155" font-size="11">• Berkas siap diekspor ke pusat</text>

  <!-- ==================== LANE 4: KEMENDAGRI ==================== -->
  <rect x="905" y="95" width="270" height="660" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <rect x="905" y="95" width="270" height="40" rx="8" fill="#1e293b" />
  <rect x="905" y="125" width="270" height="10" fill="#1e293b" />
  <text x="1040" y="121" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4. SISTEM PUSAT (IGA KEMENDAGRI)</text>

  <!-- Step 8: Terkirim -->
  <rect x="925" y="475" width="230" height="85" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2" filter="url(#shadow)" />
  <rect x="935" y="485" width="60" height="20" rx="3" fill="#000000" />
  <text x="965" y="499" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">TAHAP 8</text>
  <text x="1005" y="499" fill="#000000" font-size="13" font-weight="bold">terkirim</text>
  <text x="935" y="523" fill="#334155" font-size="11">• Data tercatat di BSKDN</text>
  <text x="935" y="539" fill="#334155" font-size="11">• indeks.inovasi.bskdn.kemendagri</text>
  <text x="935" y="555" fill="#334155" font-size="11">• Rekap Indeks Inovasi Daerah (IID)</text>

  <!-- End Circle -->
  <circle cx="1040" cy="685" r="22" fill="#0f172a" stroke="#000000" stroke-width="2" filter="url(#shadow)" />
  <text x="1040" y="689" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">SELESAI</text>

  <!-- ==================== CONNECTOR PATHS (BLACK ARROWS) ==================== -->
  <!-- Start -> Draft -->
  <path d="M 162 192 L 162 216" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />

  <!-- Draft -> Diajukan -->
  <path d="M 162 305 L 162 341" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />
  <text x="170" y="328" fill="#0f172a" font-size="10" font-weight="600">Submit</text>

  <!-- Diajukan -> Divalidasi -->
  <path d="M 280 382 L 331 382" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />
  <text x="306" y="375" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Review</text>

  <!-- Divalidasi -> Decision -->
  <path d="M 455 420 L 455 471" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />

  <!-- Decision -> Revisi (Tidak) -->
  <path d="M 380 515 L 284 515" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />
  <rect x="290" y="498" width="80" height="16" rx="2" fill="#000000" />
  <text x="330" y="510" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">TIDAK (Revisi)</text>

  <!-- Revisi -> Diajukan (Perbaikan) -->
  <path d="M 162 475 L 162 424" stroke="#475569" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowDashed)" />
  <text x="170" y="454" fill="#334155" font-size="10" font-weight="600">Perbaiki &amp; Kirim</text>

  <!-- Decision -> Disetujui (Ya) -->
  <path d="M 455 555 L 455 581" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />
  <rect x="460" y="560" width="60" height="16" rx="2" fill="#000000" />
  <text x="490" y="572" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">YA (Lolos)</text>

  <!-- Disetujui -> Disahkan OPD -->
  <path d="M 455 650 L 455 671" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />

  <!-- Disahkan OPD -> Review Internal -->
  <path d="M 575 707 L 626 707" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />
  <text x="602" y="700" fill="#0f172a" font-size="10" font-weight="600" text-anchor="middle">Diserahkan</text>

  <!-- Review Internal -> Siap Kirim -->
  <path d="M 750 675 L 750 554" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />
  <text x="758" y="618" fill="#0f172a" font-size="10" font-weight="600">Skor &amp; Dokumen Siap</text>

  <!-- Siap Kirim -> Terkirim -->
  <path d="M 870 515 L 921 515" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arrowBlack)" />
  <rect x="874" y="497" width="46" height="16" rx="2" fill="#000000" />
  <text x="897" y="509" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">KIRIM</text>

  <!-- Terkirim -> Selesai -->
  <path d="M 1040 560 L 1040 659" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arrowBlack)" />

</svg>
